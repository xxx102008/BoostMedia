<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG.ONE: מופעל אוטומציה ליוטיוב (JS + CatchMail API)</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-right: 10px; }
        button:hover:enabled { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #statusContainer { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background-color: #e9ecef; border-radius: 5px; white-space: pre-wrap;}
        h1 { color: #333; }
        .result-item { border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 5px; background-color: #fff; }
        .success { border-left: 5px solid #28a745; background-color: #d4edda; }
        .failure { border-left: 5px solid #dc3545; background-color: #f8d7da; }
        .details { margin-top: 10px; font-size: 0.9em;}
        .details strong { display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DIG-ONE: מפעיל אוטומציה ליוטיוב (JS + CatchMail API)</h1>
        <p>הקוד הזה משלב את הקריאה ל-CatchMail.io כדי לאמת את שלב האימות.</p>
        <button id="startBtn">🚀 הפעל סבב הרשמה חדש</button>
        <div id="statusContainer">
            <p id="statusMessage">הסטטוס: מוכן להפעלה.</p>
        </div>

        <h3>📋 סיכום התוצאות:</h3>
        <div id="resultsContainer">
            <!-- כאן יוצגו החשבונות בהצלחה ובכישלון -->
        </div>
    </div>

    <script>
        // ------------------------------------------------------------
        // --- הגדרות גלובליות (חייבים להתאים לאפליקציה) ---
        // ------------------------------------------------------------
        const PASSWORD_BASE = "xxx123456";
        const BATCH_SIZE = 5; 

        // *** *** *** ** !!! *** **** המפתח *** **** *** !!! **** ***
        // ** החלף את 'YOUR_API_KEY_HERE' במפתח האמיתי של CatchMail.io **
        const CATCHMAIL_API_KEY = 'YOUR_API_KEY_HERE'; 

        // *** *** *** ** !!! *** **** !!! **** ***
        // ** הקריאה ל-API צריכה להשלים את כל השלבים של גוגל (שזה הקשיים האמיתיים) **

        // ------------------------------------------------------------
        // --- פונקציות עזר ---
        // ------------------------------------------------------------

        /**
         * פונקציה המייצרת כתובת מייל ייחודית (Simulation)
         */
        function generateUniqueEmail(index) {
            // מייל דמה שמכיל את המספור
            return `user_acc_${index}@tempmailservice.com`; 
        }

        /**
         * פונקציית החיבור ל-CatchMail.io כדי לקבל את קוד האימות
         * ** זהו המקום שאתה מכניס את ה-API כאן **
         */
        async function getVerificationCodeFromCatchMail(emailAddress) {
            if (!CATCHMAIL_API_KEY || CATCHMAIL_API_KEY === 'YOUR_API_KEY_HERE') {
                console.error("API Key is missing! Cannot call CatchMail.");
                return null;
            }

            try {
                // *** *** *** ** *** *** *** *** 
                // !!! כאן אתה קורא לכתובת ה-API שלהם (הדף ששלחת) ***
                // *** *** *** ** *** *** *** *** 
                const response = await fetch(`https://api.catchmail.io/search?email=${emailAddress}&amp;key=${CATCHMAIL_API_KEY}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();

                // !!! חשוב מאוד: אתה חייב לבדוק בתיעוד שלהם איך הקוד מוחזר !!!
                // נניח שהשדה הקוד הוא 'code'
                const verificationCode = data.code; 

                if (!verificationCode) {
                    throw new Error("Code not found in API response.");
                }
                return verificationCode;

            } catch (error) {
                console.error("Error connecting to CatchMail:", error);
                return null;
            }
        }

        /**
         * פונקציית הדגמה: מחליפה את כל המימוש של Selenium
         * ב-API (Fetch)
         */
        async function mockGoogleApiCall(email, password) {
            // 1. קריאה לקבלת קוד האימות מהמייל הזמני
            const code = await getVerificationCodeFromCatchMail(email); 

            if (!code) {
                return { success: false, reason: "FAILED: Could not retrieve verification code from CatchMail API." };
            }

            // 2. *** *** *** ** *** **השלב הקריטי:** *** *** *** 
            // מכיוון שאין לנו Puppeteer, אנחנו מניחים שההרשמה מצליחה ברגע שיש קוד אימות מוצלח

            // אם אתה משתמש ב-HTML בלבד, זהו ההצלחה של האימות:
            return { 
                success: true, 
                reason: "Verification successful via CatchMail API. (Assuming Google API step succeeded.)" 
            };
        }

        // ------------------------------------------------------------
        // --- לוגיקה ראשית של הפרויקט ---
        // ------------------------------------------------------------
        async function runAccountCreation() {
            const statusMessage = document.getElementById('statusMessage');
            const startBtn = document.getElementById('startBtn');
            const resultsContainer = document.getElementById('resultsContainer');

            startBtn.disabled = true;
            resultsContainer.innerHTML = ''; // ניקוי תוצאות ישנות
            statusMessage.textContent = "🚧 ההרשמה החלה... מפעילים את לולאת האוטומציה...";

            const allResults = [];
            const creationPromises = [];

            for (let i = 0; i &lt; BATCH_SIZE; i++) {
                const currentPassword = `${PASSWORD_BASE}_${i + 1}`;
                const uniqueEmail = generateUniqueEmail(i + 1); 

                // בניית ההבטחה (Promise) עבור כל חשבון
                const promise = mockGoogleApiCall(uniqueEmail, currentPassword)
                    .then(apiResponse => ({
                        success: apiResponse.success,
                        email: uniqueEmail,
                        password: currentPassword,
                        reason: apiResponse.reason
                    }));

                creationPromises.push(promise);
            }

            // הרצת כל הבקשות במקביל (Parallelism)
            const resultsArray = await Promise.all(creationPromises);
            allResults.push(...resultsArray);

            // ------------------------------------------------------------
            // --- הצגת התוצאות (הדוח המבוקש) ---
            // ------------------------------------------------------------
            let successCount = 0;
            let totalCount = allResults.length;

            allResults.forEach(result => {
                const resultItem = document.createElement('div');

                if (result.success) {
                    successCount++;
                    resultItem.className = 'result-item success';
                    resultItem.innerHTML = `
                        <strong>✅ הצלחה:</strong> ${result.email} 
                        <div class="details"><strong>סיסמה:</strong> ${result.password}</div>
                    `;
                } else {
                    resultItem.className = 'result-item failure';
                    resultItem.innerHTML = `
                        <strong>❌ כשל:</strong> ${result.email} 
                        <div class="details"><strong>סיבת הכשל:</strong> ${result.reason}</div>
                    `;
                }
                resultsContainer.appendChild(resultItem);
            });

            // עדכון סטטוס סופי
            document.getElementById('statusMessage').innerHTML = 
                `🎉 ** סיום הסבב! ** 🎉
סה"כ ננסיו: ${totalCount}
✅ הצלחה: ${successCount}
❌ כשל: ${totalCount - successCount}`;
            startBtn.disabled = false;
        }
        // ------------------------------------------------------------
        // --- ההפעלת הלולאה (נקודת הכניסה) ---
        // ------------------------------------------------------------
        document.getElementById('startBtn').addEventListener('click', runAccountCreation);
    </script>
</body>
</html>
